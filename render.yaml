# ==============================================================================
# CrowdWisdom AI Studio — Render Production Infrastructure Blueprint
# Documentation: https://render.com/docs/blueprint-spec
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # Service 1: Backend API & Cinematic Video Production Engine
  # ----------------------------------------------------------------------------
  - type: web
    name: crowdwisdom-backend
    runtime: python
    region: oregon
    plan: starter
    branch: main
    buildCommand: pip install --upgrade pip && pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_HOST
        value: 0.0.0.0
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: MONGODB_DB_NAME
        value: crowdwisdom_ai_studio
      - key: APP_SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: APIFY_API_TOKEN
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: EXA_API_KEY
        sync: false

  # ----------------------------------------------------------------------------
  # Service 2: Frontend Static Site (React 18 + Vite + Tailwind)
  # ----------------------------------------------------------------------------
  - type: web
    name: crowdwisdom-frontend
    runtime: static
    region: oregon
    plan: free
    branch: main
    rootDir: frontend
    buildCommand: pnpm build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_WS_URL
        sync: false

